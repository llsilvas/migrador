version: '3.9'

services:
  # Redis para coordenação de partições e cache
  redis:
    image: redis:7-alpine
    container_name: migrador-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - migrador-network

  # Elasticsearch 7.17 para armazenamento de metadados biométricos
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: migrador-elasticsearch
    user: "1000:1000"  # Executar como usuário elasticsearch (UID 1000)
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.monitoring.enabled=false
      - xpack.ml.enabled=false
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - migrador-network

  # SQL Server 2019 - Banco de origem (simulando IIRGD)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: migrador-sqlserver
    user: "0:0"  # Run as root to avoid volume permission issues
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Migrador@2025!Strong
      - MSSQL_PID=Developer
      - MSSQL_AGENT_ENABLED=true
      - MSSQL_COLLATION=Latin1_General_CI_AS
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
      - ./sql-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Migrador@2025!Strong" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - migrador-network

# Volumes nomeados do Docker (gerenciados automaticamente)
volumes:
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  sqlserver_data:
    driver: local

networks:
  migrador-network:
    driver: bridge
