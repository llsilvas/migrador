spring:
  application:
    name: migrador-iirgd

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10000
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 16
          max-wait: 3000

  # Batch Configuration
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /migrador-rg

# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# Cache Configuration
cache:
  redis:
    time-to-live: 3600000
    cache-null-values: false

# Migration Configuration
migration:
  partitions: 100
  thread-pool-size: 32
  chunk-size: 5000

# Logging
logging:
  level:
    prodesp.bio.migrador: INFO
    org.springframework.batch: INFO
